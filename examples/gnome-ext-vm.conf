# Example project config: an extension packed straight from its source dir,
# tested on GNOME 50 only, with scripted test steps.
# Put it at <repo>/gnome-ext-vm.conf, <repo>/testing/gnome-ext-vm.conf or
# <repo>/testing/vm/gnome-ext-vm.conf. Paths are relative to this file.

EXT_UUID="example@example.com"
EXT_SRC_DIR="../extension"

MATRIX="fedora44"

HOOK_TEST="test-steps.sh"
